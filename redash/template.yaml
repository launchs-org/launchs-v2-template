# Redash(SQL でデータを調べて、グラフと画面にする)。web(server)、scheduler、worker、PostgreSQL、Redis の 5 つの deploy を、service の DNS 名でつなぐ。
# 最初の起動のときに、server が、テーブルを作る(create_db)。scheduler と worker は、テーブルができるまで、再起動を繰り返して待つ。
apiVersion: launchs/v1
kind: Template
metadata:
  id: redash
  name: Redash(データの可視化)
  description: データベースに SQL で問い合わせて、グラフやダッシュボードを作れます。PostgreSQL や MySQL など、たくさんのデータ源につなげます。
  icon: chart
  category: monitoring
  notes: |
    1. 初回の起動では、テーブルを作るので、公開 URL が開くまで 1〜2 分かかります。
    2. 公開 URL を開くと、最初の設定画面が出ます。管理者の名前、メールアドレス、パスワード、組織の名前を入れてください。この画面は、最初に開いた人が、操作できてしまうので、作成が終わったら、すぐ、済ませてください。
    3. データ源は、設定の「Data Sources」から足します。この Redash と同じプロジェクトの PostgreSQL などには、service の DNS 名でつなげます。

variables:
  - name: db_password
    label: 内部のデータベースのパスワード
    type: password
    generate: true
    length: 24
  - name: cookie_secret
    label: Cookie の秘密の文字列
    type: password
    generate: true
    length: 32
  - name: secret_key
    label: 暗号化の秘密の文字列
    type: password
    generate: true
    length: 32
  - name: storage
    label: データベースの大きさ(MB)
    type: integer
    default: "2048"
    min: 512
    max: 5120

resources:
  - kind: volume
    name: dbdata
    sizeMB: ${storage}

  - kind: deploy
    name: db
    image: postgres:17-alpine
    spec: medium
    replicas: 1
    env:
      POSTGRES_DB: redash
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: ${db_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    mounts:
      - volume: dbdata
        path: /var/lib/postgresql/data
    service:
      ports:
        - name: postgres
          port: 5432
          protocol: tcp

  - kind: deploy
    name: redis
    image: redis:7-alpine
    spec: small
    replicas: 1
    service:
      ports:
        - name: redis
          port: 6379
          protocol: tcp

  # web。テーブルを作れるまで(データベースが起動するまで)、繰り返して、作れたら起動する。
  - kind: deploy
    name: server
    image: redash/redash:26.9.0
    spec: large
    replicas: 1
    command: /bin/sh
    args:
      - "-c"
      - "until /app/bin/docker-entrypoint create_db; do echo 'データベースを待っています'; sleep 5; done; exec /app/bin/docker-entrypoint server"
    env:
      REDASH_DATABASE_URL: postgresql://redash:${db_password}@${service.db.dns}:5432/redash
      REDASH_REDIS_URL: redis://${service.redis.dns}:6379/0
      REDASH_COOKIE_SECRET: ${cookie_secret}
      REDASH_SECRET_KEY: ${secret_key}
      REDASH_WEB_WORKERS: "2"
    service:
      ports:
        - name: http
          port: 5000
          protocol: tcp

  - kind: deploy
    name: scheduler
    image: redash/redash:26.9.0
    spec: medium
    replicas: 1
    args: ["scheduler"]
    env:
      REDASH_DATABASE_URL: postgresql://redash:${db_password}@${service.db.dns}:5432/redash
      REDASH_REDIS_URL: redis://${service.redis.dns}:6379/0
      REDASH_COOKIE_SECRET: ${cookie_secret}
      REDASH_SECRET_KEY: ${secret_key}
      QUEUES: celery,scheduled_queries,schemas
      WORKERS_COUNT: "1"

  - kind: deploy
    name: worker
    image: redash/redash:26.9.0
    spec: medium
    replicas: 1
    args: ["worker"]
    env:
      REDASH_DATABASE_URL: postgresql://redash:${db_password}@${service.db.dns}:5432/redash
      REDASH_REDIS_URL: redis://${service.redis.dns}:6379/0
      REDASH_COOKIE_SECRET: ${cookie_secret}
      REDASH_SECRET_KEY: ${secret_key}
      QUEUES: queries,periodic,emails,default
      WORKERS_COUNT: "2"

  - kind: ingress
    rules:
      - path: /
        deploy: server
        port: 5000
