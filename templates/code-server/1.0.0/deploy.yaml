# コンテナ(deploy)。
deploys:
  - name: ide
    image: codercom/code-server:latest
    spec: large
    replicas: 1
    # イメージの ENTRYPOINT は「--bind-addr 0.0.0.0:8080 .」を含むので、args だけを足すと、引数が重複する。
    # command で ENTRYPOINT を置き換えて、開くフォルダを、1 つだけ渡す。
    command: /usr/bin/entrypoint.sh
    args: ["--bind-addr", "0.0.0.0:8080", "/home/coder/project"]
    env:
      PASSWORD: ${password}
    mounts:
      - volume: home
        path: /home/coder/project
    configmaps:
      # ワークスペースの設定。ボリュームの下に置く(マウント先の下は、置ける)。
      # 注意(Talos で確認): .vscode ディレクトリは root 所有になるため、利用者は、.vscode の中に、新しいファイルを作れない
      # (settings.json 自体は読めて、設定は効く)。
      - configmap: editor
        key: settings.json
        path: /home/coder/project/.vscode/settings.json
