# 利用者が入れる値(variables)と、作成後の案内(notes)。
notes: |
  1. 公開 URL を開くと、仮のページ(ホスト名とヘッダーの一覧)が出ます。ここが、自分のアプリに置き換わる場所です。
  2. 自分のアプリを、GitHub から自動でデプロイするには、この deploy の「概要」タブの「自動デプロイ(webhook)」を開き、画面の案内に従って、GitHub Actions の YAML を作り、リポジトリに push します。
  3. ビルドが終わると、イメージが自動で入れ替わります。アプリのポートが 80 でないときは、「Service」と ingress の「ルール」の、ポートを直してください。

