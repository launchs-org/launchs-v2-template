# テンプレートの開発のコマンド(go-task)。Go は手元に入れなくてよい(コンテナの中で動かす)。
# 使うもの: docker、kubectl、go-task、git。クラスターも、docker のコンテナ(k3s)で動くので、k3d などは要らない。
version: "3"

vars:
  # harness を動かす Go のイメージ(本体の go.mod に合わせる)。
  GO_IMAGE: golang:1.27
  # 試験用のクラスター(k3s のコンテナ)の名前と、kubeconfig の置き場。
  K3S_IMAGE: rancher/k3s:v1.33.4-k3s1
  CLUSTER: launchs-templates
  KUBECONFIG_FILE: "{{.ROOT_DIR}}/.kube/config"
  # harness を、コンテナで動かすための、共通の docker run の頭(クラスターの API に届くよう、ホストのネットワークを使う)。
  HARNESS: >-
    docker run --rm --network host
    -v harness-gomod:/go/pkg/mod
    -v {{.ROOT_DIR}}:/work -w /work/harness
    -e KUBECONFIG=/work/.kube/config
    {{.GO_IMAGE}} go run -buildvcs=false .

tasks:
  setup:
    desc: 本体(launchs/ の submodule)を取り込む。最初に 1 回。
    cmds:
      - git submodule update --init --recursive
      - docker volume create harness-gomod >/dev/null

  list:
    desc: テンプレートの一覧
    cmds:
      - "{{.HARNESS}} list --root=.."

  validate:
    desc: 全てのテンプレートを、本番と同じエンジンで検査する(CLI_ARGS に id を指定すると、それだけ)
    cmds:
      - "{{.HARNESS}} validate --root=.. {{.CLI_ARGS}}"

  plan:
    desc: 計画(作られる資源)を出す。例 `task plan -- redash --set storage=1024`
    cmds:
      - "{{.HARNESS}} plan --root=.. {{.CLI_ARGS}}"

  render:
    desc: k8s のマニフェスト(YAML)を出す。クラスター不要。例 `task render -- redash`
    cmds:
      - "{{.HARNESS}} render --root=.. {{.CLI_ARGS}}"

  cluster:up:
    desc: 試験用のクラスター(k3s を、docker のコンテナで動かす。Traefik 入り。API は 16443、HTTP は localhost:18080)を作る
    status:
      - docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -qx {{.CLUSTER}}
    cmds:
      - docker rm -f {{.CLUSTER}} >/dev/null 2>&1 || true
      - mkdir -p .kube
      - >-
        docker run -d --name {{.CLUSTER}} --privileged --tmpfs /run --tmpfs /var/run
        -p 16443:6443 -p 18080:80
        -v {{.ROOT_DIR}}/.kube:/output
        -e K3S_KUBECONFIG_OUTPUT=/output/config -e K3S_KUBECONFIG_MODE=644
        {{.K3S_IMAGE}} server --tls-san 127.0.0.1
      - until [ -s .kube/config ]; do sleep 2; done
      - sed -i 's#https://127.0.0.1:6443#https://127.0.0.1:16443#' .kube/config
      - until KUBECONFIG={{.KUBECONFIG_FILE}} kubectl get nodes 2>/dev/null | grep -q " Ready"; do sleep 3; done
      - until KUBECONFIG={{.KUBECONFIG_FILE}} kubectl get deployment/traefik -n kube-system >/dev/null 2>&1; do sleep 3; done
      - KUBECONFIG={{.KUBECONFIG_FILE}} kubectl wait --for=condition=Available deployment/traefik -n kube-system --timeout=240s

  cluster:down:
    desc: 試験用のクラスターを消す
    cmds:
      - docker rm -f {{.CLUSTER}}
      - rm -rf .kube

  test:
    desc: クラスターに展開して、Ready と HTTP を確かめる。例 `task test -- redash`(id が無ければ全て)
    cmds:
      - "{{.HARNESS}} test --root=.. {{.CLI_ARGS}}"

  test:keep:
    desc: test の後に、namespace を消さない(中を調べたいとき。`KUBECONFIG=.kube/config kubectl get all -A`)
    cmds:
      - "{{.HARNESS}} test --root=.. --keep {{.CLI_ARGS}}"

  fmt:
    desc: harness を整形する
    cmds:
      - docker run --rm -v {{.ROOT_DIR}}:/work -w /work/harness {{.GO_IMAGE}} gofmt -l -w .
