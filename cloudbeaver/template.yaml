# CloudBeaver(ブラウザで使える、データベースの管理画面。DBeaver の Web 版)。接続の設定とユーザーは、ボリュームに保存する。
apiVersion: launchs/v1
kind: Template
metadata:
  id: cloudbeaver
  name: CloudBeaver(データベース管理)
  description: ブラウザで、データベースの中身を見たり、SQL を書いたりできます。PostgreSQL、MySQL、MariaDB など、たくさんの種類につなげます。
  icon: database
  category: tool
  notes: |
    1. 公開 URL を開くと、最初の設定画面が出ます。管理者の名前とパスワードを入れてください。この画面は、最初に開いた人が、操作できてしまうので、作成が終わったら、すぐ、済ませてください。
    2. 接続は、「新しい接続」から足します。同じプロジェクトのデータベースには、service の DNS 名(deploy の詳細に出ます)でつなげます。
    3. 起動に、1〜2 分かかります。

variables:
  - name: storage
    label: 設定の置き場の大きさ(MB)
    type: integer
    default: "1024"
    min: 256
    max: 5120

resources:
  - kind: volume
    name: workspace
    sizeMB: ${storage}

  - kind: deploy
    name: cloudbeaver
    image: dbeaver/cloudbeaver:latest
    spec: large
    replicas: 1
    mounts:
      - volume: workspace
        path: /opt/cloudbeaver/workspace
    service:
      ports:
        - name: http
          port: 8978
          protocol: tcp

  - kind: ingress
    rules:
      - path: /
        deploy: cloudbeaver
        port: 8978
